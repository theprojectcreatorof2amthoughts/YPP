name: YPP build and runtime tests
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  make-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Make
        run: make
      - name: Run runtime smoke tests
        run: |
          ./ypp tests/runtime.ycpp
          ./ypp --check tests/runtime.ycpp
          ./ypp --list-libs
  cmake-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-cmake
      - name: Build
        run: cmake --build build-cmake --parallel 2
      - name: Run smoke test
        run: ./build-cmake/ypp tests/runtime.ycpp
